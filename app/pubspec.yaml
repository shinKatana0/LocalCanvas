name: localcanvas
description: "LocalCanvas - a local-first Android frontend for your own ComfyUI workflows."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.5+6

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Nine, and each of them earns its place. `flutter create` also seeds
  # `cupertino_icons`, an iOS icon font; it was removed rather than shipped
  # unused in an Android-only app.
  http: ^1.6.0                # the gateway API
  shared_preferences: ^2.5.5  # the remembered endpoint
  mobile_scanner: ^7.4.0      # QR pairing
  nsd: ^5.0.1                 # mDNS through the platform's own DNS-SD stack
  image_picker: ^1.2.0        # the Android media picker, images and video

  # Saving and sharing a result (`docs/ui-ux.md`). Both are platform surfaces
  # with no Dart-side equivalent, and both sit behind `ResultExporter` so that
  # nothing above `main.dart` depends on either.
  gal: ^2.3.3                 # into the device's own gallery; no transitive
                              # dependencies, and no manifest permission —
                              # MediaStore needs none on the releases this app
                              # supports
  share_plus: ^13.3.0         # the system share sheet. It contributes a
                              # FileProvider and a broadcast receiver to the
                              # merged manifest, under this app's own id
  path_provider: ^2.1.6       # the app's own cache directory, which is where a
                              # shared file and a saved clip have to exist for
                              # a moment. `Directory.systemTemp` is not that
                              # directory on Android

  # Reading a profile the user chose (`docs/privacy-security.md` — the profile
  # never leaves the device except by the user's own hand, and comes back the
  # same way). The ninth, and the only one this feature adds:
  #
  # * it is the only way in. Export already has one — `share_plus` hands the
  #   document to whatever the user picks — but nothing this app depends on can
  #   open a file the user points at: `image_picker` takes pictures and clips
  #   and refuses everything else, and `path_provider` names directories this
  #   app owns, which is where a profile never is;
  # * it is the Flutter team's own package, in `flutter/packages`, and on
  #   Android it is a wrapper over the system document picker — no permission
  #   in the merged manifest, no storage access beyond the one file the user
  #   chose, and no network of any kind;
  # * it sits behind `ProfileTransport`, so nothing above `main.dart` depends
  #   on it, exactly as `gal` and `share_plus` sit behind `ResultExporter`.
  file_selector: ^1.0.3       # the system document picker, for import only

  # Two languages, and the system decides which one a first run gets
  # (T-0142). Both are the Flutter team's own: `flutter_localizations` ships
  # with the SDK and carries Material's and Cupertino's own Russian strings —
  # the date picker, the text-selection menu, the "close" tooltips — which
  # this app cannot write and must not leave in English around its own
  # translated screens. `intl` is what the generated `L` class is built on.
  #
  # Neither adds a permission, a platform channel or a network call: they are
  # message lookup and nothing else.
  flutter_localizations:
    sdk: flutter
  intl: any                   # pinned by flutter_localizations, never by us

  # Playing a clip result where it was generated (`docs/ui-ux.md`: "Video
  # result: local preview where practical"; T-0211). The tenth:
  #
  # * nothing already here decodes video — `image_picker` picks a clip and
  #   `gal` saves one, and neither can draw a frame of it;
  # * it is the Flutter team's own package, in `flutter/packages`, over
  #   ExoPlayer. The plugin's own manifest declares no permission, but
  #   ExoPlayer's adds one: WAKE_LOCK, a normal install-time permission that
  #   keeps a playing clip from being cut off by the device sleeping. Measured
  #   by diffing the merged release manifest before and after, and disclosed
  #   in `docs/privacy-security.md`;
  # * it is handed a staged FILE, never a URL, so it makes no network request
  #   of its own and the jobs API stays the one place a result path becomes an
  #   address (`docs/transport-boundary.md`);
  # * it sits behind `ClipPlayback`, so nothing above `main.dart` depends on
  #   it, exactly as `gal` and `share_plus` sit behind `ResultExporter`.
  #
  # The cost is size: the Android plugin links ExoPlayer with its HLS, DASH,
  # RTSP and SmoothStreaming modules, none of which a staged file needs.
  video_player: ^2.14.0       # a result clip, played from the app's cache

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test-only: the package's own in-memory platform, so the remembered
  # endpoint can be exercised through the real store rather than around it.
  shared_preferences_platform_interface: ^2.4.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The `.arb` files under `lib/l10n/` are compiled into the `L` class by
  # `flutter gen-l10n`, which `flutter pub get` and every build run for us.
  # Configuration is in `app/l10n.yaml`.
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
